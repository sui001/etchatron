<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attractor Timeline</title>
<!-- PAGE_VERSION below: bump on every change, shown in the header -->
<!--
  Attractor timeline. Strange attractors and their ancestors, from
  Ptolemy's epicycles to Halvorsen, each drawn live on four screens (top,
  front, side in a drafting layout, plus an orthogonal view you drag to turn).

  Only Lorenz (1963) onward were found as attractors. The older entries are
  older equations shown the way later work found them to behave: the
  pendulum, Duffing, van der Pol and the governor go chaotic once they have
  friction and a rhythmic push. Each entry says which it is.

  Every entry is calibrated the first time it is picked: a silent run
  measures its size, it is scaled to fit the box without distorting it, and
  its step is set so it moves at Lorenz's average speed. Steps are RK4.

  Screens only for now. Serve it with
    python -m http.server 8000 --directory timeline
  then http://localhost:8000
-->
<style>
:root {
  --paper: #f7f4ec;
  --card: #ffffff;
  --ink: #111111;
  --line: #1a1a1a;
  --soft: #d8d2c4;
  --accent: #0047c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 12px 16px 4px; }
header h1 { font-size: 20px; margin: 0; }
#pageVer { color: var(--accent); font-weight: 700; font-size: 15px; }
header .sub { font-weight: 600; }
button { font: inherit; font-weight: 700; color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: #fff3c4; }
button.primary { background: var(--ink); color: #fff; }
/* timeline */
#tl { position: relative; margin: 8px 16px 0; height: 210px; }
#tl .axis { position: absolute; left: 0; right: 0; top: 34px; height: 3px; background: var(--line); }
#tl .tick { position: absolute; top: 40px; font-size: 12px; font-weight: 700; transform: translateX(-50%); }
#tl .tick::before { content: ""; position: absolute; left: 50%; top: -9px; height: 8px; border-left: 2px solid var(--line); }
#tl .dot { position: absolute; z-index: 3; top: 27px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%;
  border: 2px solid var(--line); cursor: pointer; }
#tl .lab { position: absolute; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
  padding: 1px 6px; border-radius: 6px; border: 2px solid transparent; background: var(--paper); z-index: 2; }
#tl .lab b { font-weight: 800; }
#tl .lab.sel { border-color: var(--line); background: #fff; }
#tl .lead { position: absolute; border-left: 2px solid; width: 0; }
.eras { display: flex; gap: 14px; flex-wrap: wrap; padding: 2px 16px 0; font-weight: 700; font-size: 13px; }
.eras span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  margin-right: 5px; vertical-align: -1px; background: var(--c); }
/* entry card and controls */
.bar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 10px 16px 0; max-width: 1240px; }
@media (max-width: 800px) { .bar { grid-template-columns: 1fr; } }
#card { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px;
  border-left-width: 10px; }
#card h2 { margin: 0; font-size: 19px; }
#card .meta { font-weight: 700; }
#card .tag { display: inline-block; margin-top: 6px; padding: 1px 9px; border-radius: 999px; font-weight: 800;
  font-size: 13px; color: #fff; }
#card p { margin: 6px 0 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stats { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 8px; }
/* screens: drafting layout (third angle), top over front, side beside front */
main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px;
  max-width: 1240px; grid-template-areas: "top orth" "front side"; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-areas: "top" "front" "side" "orth"; } }
section { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; }
h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 13px; }
canvas { width: 100%; aspect-ratio: 1; background: var(--paper); border-radius: 8px; display: block;
  border: 1px solid var(--soft); }
#vo { cursor: grab; touch-action: none; }
#vo.drag { cursor: grabbing; }
</style>
</head>
<body>
<header>
  <h1>Attractor timeline <span id="pageVer"></span></h1>
  <span class="sub">from Ptolemy to Halvorsen, click an entry or use the arrow keys</span>
</header>
<div class="eras" id="eras"></div>
<div id="tl"></div>

<div class="bar">
  <div id="card"></div>
  <div>
    <div class="controls">
      <button id="btnPlay" class="primary">Pause</button>
      <button id="btnRestart">New start</button>
    </div>
    <div class="stats">Steps <span id="sSteps">0</span></div>
  </div>
</div>

<main>
  <section style="grid-area:side"><h3>Side <small>(from the right, looking along x: y-z plane)</small></h3><canvas id="vx" width="560" height="560"></canvas></section>
  <section style="grid-area:front"><h3>Front <small>(looking along y: x-z plane)</small></h3><canvas id="vy" width="560" height="560"></canvas></section>
  <section style="grid-area:top"><h3>Top <small>(looking down z: x-y plane)</small></h3><canvas id="vz" width="560" height="560"></canvas></section>
  <section style="grid-area:orth"><h3>Orthogonal <small>(drag to turn)</small></h3><canvas id="vo" width="560" height="560"></canvas></section>
</main>

<script>
'use strict';
const PAGE_VERSION = '0.1.0';   // 0.1.0 first page: 16 entries, four screens, light theme
document.getElementById('pageVer').textContent = 'v' + PAGE_VERSION;
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------------- eras
const ERAS = {
  ancient:   { name: 'Ancient',            ink: [184, 0, 31] },
  clockwork: { name: 'Clockwork',          ink: [196, 85, 0] },
  machines:  { name: 'Machines and radio', ink: [0, 71, 194] },
  cyber:     { name: 'Cybernetics',        ink: [138, 0, 194] },
  chaos:     { name: 'Chaos',              ink: [0, 122, 61] },
};
const BEHAVES = {
  chaotic: 'chaotic: never repeats, and nearby starts part',
  quasi:   'never quite repeats, but not chaotic',
  settles: 'settles, is disturbed, rewires itself',
};

// Forced oscillators carry the push's phase as time goes around a ring:
// the ring is the rhythm, the oscillator moves across it.
const ring = (R, a, b, phase) => [(R + a) * Math.cos(phase), (R + a) * Math.sin(phase), b];

// Seeded random numbers, so a calibration run is the same every time.
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------- entries
// d(t, s, g): derivative of state s at time t. view(s, t, g): the 3D point
// drawn. warm / T: time units of silent run before and during calibration,
// at fine step h. hmax: largest RK4 substep the system tolerates.
const ENTRIES = [
  { id: 'ptolemy', year: 150, era: 'ancient', behaves: 'quasi', name: 'Epicycles (Mars)',
    who: 'Ptolemy, Almagest, about 150 CE',
    note: 'Mars rides a small circle (the epicycle) whose centre rides a big one (the deferent). The two periods do not divide evenly, so the retrograde loops never land in the same place twice. No chaos: it is clockwork that never quite repeats. Equant left out, and the epicycle\'s tilt exaggerated so the 3D views have depth.',
    s0: [0], d: () => [1],
    view: (s) => { const t = s[0], wd = 2 * Math.PI / 1.8809, ws = 2 * Math.PI;
      return [60 * Math.cos(wd * t) + 39.5 * Math.cos(ws * t), 60 * Math.sin(wd * t) + 39.5 * Math.sin(ws * t),
        12 * Math.sin((ws - wd) * t)]; },
    warm: 0, T: 120, h: 0.002, hmax: 0.01 },

  { id: 'pendulum', year: 1673, era: 'clockwork', behaves: 'chaotic', name: 'Pendulum, pushed in rhythm',
    who: 'Galileo (about 1602) and Huygens, Horologium Oscillatorium (1673)',
    note: 'The pendulum that made clocks keep time. Give it friction and a rhythmic push and it goes chaotic, sometimes swinging, sometimes whirling right over the top. The settings are Baker and Gollub\'s (1990). Drawn on a ring for the push\'s rhythm, with the swing wrapping a tube whose thickness is the speed.',
    p: { q: 2, g: 1.5, w: 2 / 3 },
    s0: [0.2, 0], jit: [0.05, 0.05],
    d: (t, [th, om], gn) => { const p = gn.e.p; return [om, -om / p.q - Math.sin(th) + p.g * Math.cos(p.w * t)]; },
    view: ([th, om], t, gn) => { const r = 1 + 0.2 * om, R = 3, ph = gn.e.p.w * t;
      return ring(R, r * Math.cos(th), r * Math.sin(th), ph); },
    warm: 200, T: 3000, h: 0.01, hmax: 0.05 },

  { id: 'governor', year: 1788, yearText: '1788 / 1868', era: 'cyber', behaves: 'chaotic', name: 'Watt governor',
    who: 'James Watt (1788); James Clerk Maxwell, "On Governors" (1868)',
    note: 'The flyball governor holds a steam engine\'s speed: faster, the balls fly out and close the steam. Maxwell\'s paper on it began control theory, and Wiener named cybernetics after the governor. Equations as Pontryagin gives them (arm angle, arm speed, engine speed); the rhythmic load and its chaotic settings are ours, found by search.',
    p: { eps: 0.4, alpha: 1.2, beta: 0.5, b1: 0.3, w: 0.9 },
    s0: [0.8, 0, 1.4], jit: [0.01, 0.01, 0.01],
    d: (t, [x, y, z], gn) => { const p = gn.e.p, beta = p.beta + p.b1 * Math.sin(p.w * t);
      return [y, z * z * Math.sin(x) * Math.cos(x) - Math.sin(x) - p.eps * y, p.alpha * (Math.cos(x) - beta)]; },
    view: ([x, y, z]) => [Math.sin(x) * z, Math.cos(x) * z, y],
    warm: 300, T: 3000, h: 0.01, hmax: 0.05 },

  { id: 'duffing', year: 1918, era: 'machines', behaves: 'chaotic', name: 'Duffing oscillator',
    who: 'Georg Duffing, on forced vibration in machines (1918)',
    note: 'A spring that stiffens as it stretches, with two resting places. Pushed in rhythm it hops between them unpredictably. The chaos was found later; these settings are the classic ones (Holmes, 1979).',
    p: { delta: 0.3, gamma: 0.5, w: 1.2 },
    s0: [1, 0], jit: [0.05, 0.05],
    d: (t, [x, v], gn) => { const p = gn.e.p; return [v, -p.delta * v + x - x * x * x + p.gamma * Math.cos(p.w * t)]; },
    view: ([x, v], t, gn) => ring(3, x, v, gn.e.p.w * t),
    warm: 200, T: 3000, h: 0.01, hmax: 0.05 },

  { id: 'vanderpol', year: 1927, era: 'machines', behaves: 'chaotic', name: 'Van der Pol oscillator',
    who: 'Balthasar van der Pol and Jan van der Mark, valve radio circuits (1927)',
    note: 'A valve circuit that keeps itself oscillating. Driven by a second rhythm, van der Pol and van der Mark heard an "irregular noise" they put down to the apparatus; it is now read as an early sighting of chaos. Cartwright and Littlewood proved the strange behaviour in 1945. Settings after Parlitz and Lauterborn (1987).',
    p: { mu: 8.53, A: 1.2, w: 2 * Math.PI / 10 },
    s0: [1, 0], jit: [0.05, 0.05],
    d: (t, [x, v], gn) => { const p = gn.e.p; return [v, p.mu * (1 - x * x) * v - x + p.A * Math.sin(p.w * t)]; },
    view: ([x, v], t, gn) => ring(4, x, v / 6, gn.e.p.w * t),
    warm: 300, T: 4000, h: 0.002, hmax: 0.004 },

  { id: 'homeostat', year: 1948, era: 'cyber', behaves: 'settles', name: 'Homeostat',
    who: 'W. Ross Ashby, Design for a Brain (1952; built 1948)',
    note: 'Four units, each a needle driven by the other three. When a needle passes its limit, that unit\'s uniselector steps and rewires its inputs at random, until the four find a way to settle. Then the experimenter disturbs it again. Not chaos: adaptation. Drawn from the first three needles. Our model, after Ashby\'s equations.',
    p: { limit: 1, kick: 12, amp: 1, stepGap: 0.5, self: -1, w: 0.8 },
    s0: [0.3, -0.2, 0.1, 0, 0, 0, 0, 0], seeded: true,
    init: (g) => {
      g.x.table = [0, 1, 2, 3].map(() => Array.from({ length: 25 }, () => [0, 1, 2, 3].map(() => (g.rand() * 2 - 1) * g.e.p.w)));
      g.x.pos = [0, 0, 0, 0]; g.x.lastStep = [-9, -9, -9, -9]; g.x.nextKick = g.e.p.kick;
      g.x.a = [0, 1, 2, 3].map((i) => g.x.table[i][0].map((v, j) => (i === j ? g.e.p.self : v)));
    },
    d: (t, s, g) => { const a = g.x.a, out = new Array(8);
      for (let i = 0; i < 4; i++) {
        let f = 0; for (let j = 0; j < 4; j++) f += a[i][j] * s[j];
        out[i] = s[4 + i]; out[4 + i] = f - s[4 + i];          // x'' = sum(a x) - x'
      }
      return out; },
    event: (g) => { const s = g.s, p = g.e.p, x = g.x;
      for (let i = 0; i < 4; i++) {
        if (Math.abs(s[i]) > 1.5) { s[i] = Math.sign(s[i]) * 1.5; s[4 + i] = 0; }   // end of the trough
        if (Math.abs(s[i]) > p.limit && g.t - x.lastStep[i] > p.stepGap) {          // uniselector steps
          x.pos[i] = (x.pos[i] + 1) % 25; x.lastStep[i] = g.t;
          x.a[i] = x.table[i][x.pos[i]].map((v, j) => (i === j ? p.self : v));
          g.rewires = (g.rewires || 0) + 1;
        }
      }
      if (g.t >= x.nextKick) { s[4 + Math.floor(g.rand() * 4)] += (g.rand() < 0.5 ? -1 : 1) * p.amp; x.nextKick += p.kick; }
    },
    view: (s) => [s[0], s[1], s[2]],
    dtFixed: 0.04, warm: 0, T: 2000, h: 0.01, hmax: 0.02 },

  { id: 'ueda', year: 1961, era: 'machines', behaves: 'chaotic', name: 'Ueda attractor',
    who: 'Yoshisuke Ueda, on an analogue computer (November 1961)',
    note: 'A forced circuit studied on an analogue computer at Kyoto. Ueda saw chaos on its screen two years before Lorenz, but it was dismissed as error and not published for years. Sometimes called the Japanese attractor.',
    p: { k: 0.05, B: 7.5 },
    s0: [2.5, 0], jit: [0.05, 0.05],
    d: (t, [x, v], gn) => { const p = gn.e.p; return [v, -p.k * v - x * x * x + p.B * Math.cos(t)]; },
    view: ([x, v], t) => ring(6, x, v / 2, t),
    warm: 200, T: 3000, h: 0.005, hmax: 0.02 },

  { id: 'lorenz', year: 1963, era: 'chaos', behaves: 'chaotic', name: 'Lorenz',
    who: 'Edward Lorenz, "Deterministic Nonperiodic Flow" (1963)',
    note: 'A cut-down model of convection, run on a Royal McBee LGP-30 at MIT. Restarting a run from rounded numbers gave a different forecast: the start of chaos as a science. The first strange attractor, though the name came in 1971.',
    s0: [0, 1, 1.05], jit: [0, 0.02, 0.02],
    d: (t, [x, y, z]) => [10 * (y - x), 28 * x - x * z - y, x * y - (8 / 3) * z],
    view: (s) => s, warm: 0, T: 4000, h: 0.002, hmax: 0.01 },

  { id: 'moore', year: 1966, era: 'chaos', behaves: 'chaotic', name: 'Moore and Spiegel',
    who: 'Derek Moore and Edward Spiegel, a model of stellar convection (1966)',
    note: 'A parcel of gas bobbing in a star, heated and cooled as it rises and falls. One of the earliest chaotic systems after Lorenz, found independently. Its three variables are position, speed and acceleration, so speed is drawn at 1/2.5 and acceleration at 1/20 to keep the figure readable.',
    p: { T: 6, R: 20 },
    s0: [0.1, 0, 0], jit: [0.02, 0.02, 0.02],
    d: (t, [x, y, z], gn) => { const p = gn.e.p; return [y, z, -z - (p.T - p.R + p.R * x * x) * y - p.T * x]; },
    view: ([x, y, z]) => [x, y / 2.5, z / 20], warm: 200, T: 3000, h: 0.002, hmax: 0.01 },

  { id: 'rossler', year: 1976, era: 'chaos', behaves: 'chaotic', name: 'Rössler',
    who: 'Otto Rössler, after a chemical reaction (1976)',
    note: 'Designed to be the simplest possible chaos: a spiral that every so often flicks up and folds back in, like a strip of pastry.',
    s0: [7.72, -8.53, 0.15], jit: [0, 0.1, 0.01],
    d: (t, [x, y, z]) => [-y - z, x + 0.2 * y, 0.2 + z * (x - 5.7)],
    view: (s) => s, warm: 200, T: 4000, h: 0.005, hmax: 0.02 },

  { id: 'rabinovich', year: 1979, era: 'chaos', behaves: 'chaotic', name: 'Rabinovich and Fabrikant',
    who: 'Mikhail Rabinovich and Anatoly Fabrikant, waves in a nonequilibrium medium (1979)',
    note: 'From the physics of waves in plasma. Its shapes change sharply with its two settings; these are the ones usually drawn.',
    p: { g: 0.87, a: 1.1 },
    s0: [-1, 0, 0.5], jit: [0.01, 0.01, 0.01],
    d: (t, [x, y, z], gn) => { const p = gn.e.p;
      return [y * (z - 1 + x * x) + p.g * x, x * (3 * z + 1 - x * x) + p.g * y, -2 * z * (p.a + x * y)]; },
    view: (s) => s, warm: 200, T: 3000, h: 0.002, hmax: 0.005 },

  { id: 'aizawa', year: 1982, era: 'chaos', behaves: 'chaotic', name: 'Aizawa',
    who: 'Yoji Aizawa (1982), as given in later collections',
    note: 'A ball with a tube through its axis: the path winds round the sphere and every so often shoots up the middle.',
    s0: [-1.086, -0.398, 1.386], jit: [0, 0.01, 0.01],
    d: (t, [x, y, z]) => { const a = 0.95, ab = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1;
      return [(z - ab) * x - d * y, d * x + (z - ab) * y,
        c + a * z - z ** 3 / 3 - (x * x + y * y) * (1 + e * z) + f * z * x ** 3]; },
    view: (s) => s, warm: 200, T: 4000, h: 0.002, hmax: 0.01 },

  { id: 'chua', year: 1983, era: 'chaos', behaves: 'chaotic', name: 'Chua\'s circuit',
    who: 'Leon Chua, a circuit built to be chaotic (1983)',
    note: 'Two capacitors, an inductor and one piecewise-linear resistor: the first electronic circuit designed to be chaotic, and proved so. The double scroll.',
    p: { al: 15.6, be: 28, m0: -1.143, m1: -0.714 },
    s0: [0.7, 0, 0], jit: [0.01, 0.01, 0.01],
    d: (t, [x, y, z], gn) => { const p = gn.e.p, f = p.m1 * x + 0.5 * (p.m0 - p.m1) * (Math.abs(x + 1) - Math.abs(x - 1));
      return [p.al * (y - x - f), x - y + z, -p.be * y]; },
    view: (s) => s, warm: 200, T: 3000, h: 0.002, hmax: 0.01 },

  { id: 'thomas', year: 1999, era: 'chaos', behaves: 'chaotic', name: 'Thomas',
    who: 'René Thomas, cyclically symmetric (1999)',
    note: 'Each variable is driven by the sine of the next, with friction b. A labyrinth that looks the same from all three axes. b = 0.185: the commonly quoted 0.208186 is a repeating loop.',
    p: { b: 0.185 },
    s0: [0.197, -0.823, 0.473], jit: [0, 0.02, 0.02],
    d: (t, [x, y, z], gn) => { const b = gn.e.p.b; return [Math.sin(y) - b * x, Math.sin(z) - b * y, Math.sin(x) - b * z]; },
    view: (s) => s, warm: 200, T: 4000, h: 0.01, hmax: 0.05 },

  { id: 'chen', year: 1999, era: 'chaos', behaves: 'chaotic', name: 'Chen',
    who: 'Guanrong Chen and Tetsushi Ueta (1999)',
    note: 'Found while trying to control chaos: Lorenz\'s near relation, with a different twist between the wings.',
    s0: [-10, 0, 37], jit: [0, 0.1, 0.1],
    d: (t, [x, y, z]) => { const a = 35, b = 3, c = 28; return [a * (y - x), (c - a) * x - x * z + c * y, x * y - b * z]; },
    view: (s) => s, warm: 200, T: 3000, h: 0.001, hmax: 0.004 },

  { id: 'halvorsen', year: 2010, era: 'chaos', behaves: 'chaotic', name: 'Halvorsen',
    who: 'Arne Dehli Halvorsen, collected in Sprott\'s Elegant Chaos (2010)',
    note: 'Three-fold symmetric, like Thomas: three lobes chasing each other. a = 1.4: the 1.89 often quoted repeats.',
    p: { a: 1.4 },
    s0: [1.447, -6.437, -4.455], jit: [0, 0.05, 0.05],
    d: (t, [x, y, z], gn) => { const a = gn.e.p.a;
      return [-a * x - 4 * y - 4 * z - y * y, -a * y - 4 * z - 4 * x - z * z, -a * z - 4 * x - 4 * y - x * x]; },
    view: (s) => s, warm: 200, T: 4000, h: 0.002, hmax: 0.01 },
];

// ------------------------------------------------------------- generator
const TARGET = [[-19, 21], [-24, 25], [1, 54]];         // the control page's box
const TC = TARGET.map(([lo, hi]) => (lo + hi) / 2);
const MAX_DRAWN = 8;                                    // points drawn per 10 ms step, at most

class Gen {
  constructor(e, { jitter = true, seed = 1 } = {}) {
    this.e = e; this.t = 0; this.steps = 0; this.x = {};
    this.rand = rng(e.seeded && jitter ? Math.floor(Math.random() * 2 ** 31) : seed);
    const r = () => Math.random() * 2 - 1;
    this.s = e.s0.map((v, i) => v + (jitter && e.jit ? e.jit[i] * r() : 0));
    if (e.init) e.init(this);
  }
  advance(h) {
    const d = this.e.d, s = this.s, t = this.t;
    const k1 = d(t, s, this);
    const k2 = d(t + h / 2, s.map((v, i) => v + k1[i] * h / 2), this);
    const k3 = d(t + h / 2, s.map((v, i) => v + k2[i] * h / 2), this);
    const k4 = d(t + h, s.map((v, i) => v + k3[i] * h), this);
    this.s = s.map((v, i) => v + (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]) * h / 6);
    this.t += h;
    if (this.e.event) this.e.event(this);
  }
  raw() { return this.e.view(this.s, this.t, this); }
  canon() { const c = this.e.cal, r = this.raw(); return r.map((v, i) => TC[i] + (v - c.mid[i]) * c.k); }
  // one step = 10 ms; returns the canonical points to draw for it
  step() {
    const c = this.e.cal, out = [], every = Math.ceil(c.n / MAX_DRAWN);
    for (let i = 1; i <= c.n; i++) {
      this.advance(c.dt / c.n);
      if (i % every === 0 || i === c.n) out.push(this.canon());
    }
    this.steps++;
    return out;
  }
}

// Calibration, once per entry: a silent run from the entry's own start (no
// jitter, fixed seed) measures the figure's box (0.5 to 99.5 percentile, so a
// rare excursion does not shrink the whole figure) and its average speed. One
// scale for all three axes, so shapes are not stretched; dt so it moves at
// Lorenz's average speed per step at dt 0.01.
let VREF = null;
function calibrate(e) {
  if (e.cal) return e.cal;
  const g = new Gen(e, { jitter: false }), h = e.h;
  for (let t = 0; t < e.warm; t += h) g.advance(h);
  const seen = [[], [], []];
  let prev = g.raw(), path = 0, n = 0;
  for (let t = 0; t < e.T; t += h) {
    g.advance(h);
    const r = g.raw();
    if (n % 4 === 0) for (let i = 0; i < 3; i++) seen[i].push(r[i]);
    path += Math.hypot(r[0] - prev[0], r[1] - prev[1], r[2] - prev[2]); prev = r; n++;
  }
  const pick = (a, q) => a[Math.min(a.length - 1, Math.floor(q * a.length))];
  seen.forEach((a) => a.sort((u, v) => u - v));
  const lo = seen.map((a) => pick(a, 0.005)), hi = seen.map((a) => pick(a, 0.995));
  const k = Math.min(...[0, 1, 2].map((i) => (TARGET[i][1] - TARGET[i][0]) / Math.max(1e-9, hi[i] - lo[i])));
  const speed = k * path / (n * h);                     // canonical units per time unit
  if (e.id === 'lorenz') VREF = 0.01 * speed;
  else if (VREF === null) calibrate(ENTRIES.find((q) => q.id === 'lorenz'));
  const dt = e.dtFixed || VREF / speed;
  e.cal = { k, mid: lo.map((v, i) => (v + hi[i]) / 2), dt, n: Math.max(1, Math.ceil(dt / e.hmax)), lo, hi };
  return e.cal;
}

// --------------------------------------------------------------- the trail
// The control page's afterglow, turned to ink on paper. Each view's trail
// canvas holds ink as light on black, faded every 60 Hz frame (multiplied by
// 252/255 with 2.5% black over it), and is shown inverted and multiplied onto
// the paper: fresh lines in the era's ink, paling to paper, with 8-bit
// rounding leaving the faint ghost of the whole figure. The orthogonal view
// rebuilds its trail from history when it turns; DECAY is that fade in 8-bit
// arithmetic, rounding to nearest, as views/index.html works it out.
const FRAME_MS = 1000 / 60;
const HIST_MAX = 30000 * MAX_DRAWN;
function fade(ctx, n) {
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgb(252,252,252)'; ctx.fillRect(0, 0, n, n);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.025)'; ctx.fillRect(0, 0, n, n);
}
const DECAY = (() => {
  const keep = 1 - Math.round(0.025 * 255) / 255;
  let row = new Uint8Array(256);
  for (let i = 0; i < 256; i++) row[i] = i;
  const rows = [row];
  for (let f = 1; f < 2000; f++) {
    const next = row.map((v) => Math.round(Math.round(v * 252 / 255) * keep));
    rows.push(next);
    if (next.every((v, i) => v === row[i])) break;
    row = next;
  }
  return rows;
})();
const faded = (c, frames) => {
  const row = DECAY[Math.min(DECAY.length - 1, Math.max(0, Math.round(frames)))];
  return c.map((v) => row[v]);
};

// history: { p, t, c, brk, st } = point, time drawn, trail colour (ink
// inverted), no line into it, last point of its step
const hist = [];
let drawnTo = 0;
let INK = [0, 0, 0];
function addPoint(p, t, brk, st) { hist.push({ p, t, brk, st, c: INK.map((v) => 255 - v) }); }

// -------------------------------------------------------------- the views
const SS = 2;
const AXIS = ['#d00000', '#008a00', '#0050d0'];       // x, y, z
const AXN = ['x', 'y', 'z'];
const orient = { yaw: -0.6, pitch: 0.45 };
const C = TC;

function flatView(id, h, v) {
  return { id, h, v, proj(p, W) {
    const K = (W / 2 - 20) / 29;
    return [W / 2 + (p[h] - C[h]) * K, W / 2 - (p[v] - C[v]) * K];
  } };
}
function rot(d) {
  const cy = Math.cos(orient.yaw), sy = Math.sin(orient.yaw);
  const cp = Math.cos(orient.pitch), sp = Math.sin(orient.pitch);
  const x = d[0] * cy - d[1] * sy, y = d[0] * sy + d[1] * cy;
  return [x, d[2] * cp + y * sp];
}
const VIEWS = [
  flatView('vx', 1, 2),
  flatView('vy', 0, 2),
  flatView('vz', 0, 1),
  { id: 'vo', ortho: true, proj(p, W) {
    const K = (W / 2 - 20) / 42;
    const [u, v] = rot([p[0] - C[0], p[1] - C[1], p[2] - C[2]]);
    return [W / 2 + u * K, W / 2 - v * K];
  } },
];
for (const v of VIEWS) {
  v.cv = $(v.id); v.cx = v.cv.getContext('2d'); v.W = v.cv.width;
  v.trail = document.createElement('canvas'); v.trail.width = v.trail.height = v.W * SS;
  v.tx = v.trail.getContext('2d'); v.tx.fillStyle = '#000'; v.tx.fillRect(0, 0, v.W * SS, v.W * SS);
  v.prev = null; v.dirty = false;
}
function segment(t, a, b) { t.moveTo(a[0] * SS, a[1] * SS); t.lineTo(b[0] * SS, b[1] * SS); }

function rebuild(v, now) {
  const t = v.tx, n = v.W * SS, groups = new Map(), ghost = DECAY.length - 1;
  t.fillStyle = '#000'; t.fillRect(0, 0, n, n);
  let prev = null, brk = false;
  for (let i = 0; i < hist.length; i++) {
    const h = hist[i], age = (now - h.t) / FRAME_MS;
    brk = brk || h.brk;
    if (!h.st && age >= ghost) continue;               // ghost: step ends are enough
    const s = v.proj(h.p, v.W);
    if (prev && !brk) {
      const c = faded(h.c, age);
      if (c[0] || c[1] || c[2]) {
        const key = `rgb(${c})`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(prev, s);
      }
    }
    prev = s; brk = false;
  }
  t.lineCap = 'round'; t.lineWidth = 2 * SS;
  for (const [key, segs] of groups) {
    t.strokeStyle = key; t.beginPath();
    for (let i = 0; i < segs.length; i += 2) segment(t, segs[i], segs[i + 1]);
    t.stroke();
  }
  v.prev = prev; v.dirty = false;
}

const PAPER = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
function render(v, now) {
  const W = v.W, t = v.tx;
  if (v.dirty) rebuild(v, now);
  else {
    fade(t, W * SS);
    t.lineCap = 'round'; t.lineWidth = 2 * SS;
    for (let i = drawnTo; i < hist.length; i++) {
      const h = hist[i], s = v.proj(h.p, W);
      if (h.brk) v.prev = null;
      if (v.prev) { t.strokeStyle = `rgb(${h.c})`; t.beginPath(); segment(t, v.prev, s); t.stroke(); }
      v.prev = s;
    }
  }
  const x = v.cx;
  x.globalCompositeOperation = 'source-over'; x.fillStyle = PAPER; x.fillRect(0, 0, W, W);
  x.globalCompositeOperation = 'multiply'; x.filter = 'invert(1)';
  x.drawImage(v.trail, 0, 0, W, W);
  x.filter = 'none'; x.globalCompositeOperation = 'source-over';
  const last = hist[hist.length - 1];
  if (last) {
    const [hx, hy] = v.proj(last.p, W);
    x.fillStyle = `rgba(${INK},0.18)`; x.beginPath(); x.arc(hx, hy, 11, 0, 7); x.fill();
    x.fillStyle = `rgb(${INK})`; x.beginPath(); x.arc(hx, hy, 4.5, 0, 7); x.fill();
  }
  drawAxes(v);
}

function drawAxes(v) {
  const x = v.cx, o = [28, v.W - 28], L = 34;
  const dirs = v.ortho ? [0, 1, 2].map((i) => { const d = [0, 0, 0]; d[i] = 1; return rot(d); })
    : [0, 1, 2].map((i) => i === v.h ? [1, 0] : i === v.v ? [0, 1] : null);
  x.lineWidth = 2.5; x.font = '700 15px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  dirs.forEach((d, i) => {
    if (!d) return;
    const e = [o[0] + d[0] * L, o[1] - d[1] * L];
    x.strokeStyle = x.fillStyle = AXIS[i];
    x.beginPath(); x.moveTo(o[0], o[1]); x.lineTo(e[0], e[1]); x.stroke();
    const m = Math.hypot(d[0], d[1]) || 1;
    x.fillText(AXN[i], o[0] + d[0] / m * (L * Math.max(m, 0.35) + 11), o[1] - d[1] / m * (L * Math.max(m, 0.35) + 11));
  });
}

(() => {
  const cv = $('vo'); let last = null;
  cv.addEventListener('pointerdown', (e) => { last = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', (e) => {
    if (!last) return;
    const k = 0.01 * cv.width / cv.clientWidth;
    orient.yaw += (e.clientX - last[0]) * k;
    orient.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, orient.pitch + (e.clientY - last[1]) * k));
    last = [e.clientX, e.clientY];
    VIEWS[3].dirty = true;
  });
  const up = () => { last = null; cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
})();

// -------------------------------------------------------------- the clock
const play = { gen: null, paused: false, t0: 0, n: 0, brk: true };
function rebase() { play.t0 = performance.now(); play.n = 0; }
function advance(now) {
  if (play.paused) return;
  const due = Math.floor((now - play.t0) / 10);
  if (due - play.n > 300) play.n = due - 300;
  while (play.n < due) {
    const pts = play.gen.step(), t = play.t0 + play.n * 10;
    play.n++;
    pts.forEach((p, i) => addPoint(p, t + 10 * (i + 1) / pts.length, play.brk && i === 0, i === pts.length - 1));
    play.brk = false;
  }
}
function frame() {
  const now = performance.now();
  advance(now);
  for (const v of VIEWS) render(v, now);
  drawnTo = hist.length;
  if (hist.length > HIST_MAX + 5000) { hist.splice(0, hist.length - HIST_MAX); drawnTo = hist.length; }
  $('sSteps').textContent = play.gen.steps;
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- timeline
// Log scale of years before now, so the twentieth century's crowd has room
// and Ptolemy still fits on the left.
const NOW = 2026, OLDEST = 2100, NEWEST = 12;
const frac = (year) => (Math.log(OLDEST) - Math.log(NOW - year)) / (Math.log(OLDEST) - Math.log(NEWEST));
let selected = 0;

function drawTimeline() {
  const tl = $('tl'), W = tl.clientWidth;
  tl.textContent = '';
  const ax = document.createElement('div'); ax.className = 'axis'; tl.append(ax);
  let lastTick = -Infinity;
  for (const y of [1000, 1500, 1700, 1800, 1900, 1950, 2000]) {
    if (frac(y) * W - lastTick < 44) continue;          // a narrow screen keeps the ticks that fit
    lastTick = frac(y) * W;
    const t = document.createElement('div'); t.className = 'tick';
    t.style.left = (frac(y) * 100) + '%'; t.textContent = y < 1000 ? y + ' CE' : y; tl.append(t);
  }
  // labels in rows below the axis, each in the first row with room
  const rowsEnd = [];
  ENTRIES.forEach((e, i) => {
    const px = frac(e.year) * W, ink = `rgb(${ERAS[e.era].ink})`;
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = px + 'px'; d.style.background = ink;
    d.title = e.name; d.onclick = () => select(i); tl.append(d);
    const l = document.createElement('div'); l.className = 'lab' + (i === selected ? ' sel' : '');
    l.innerHTML = `<b>${e.yearText || (e.year < 1000 ? e.year + ' CE' : e.year)}</b> ${e.name}`;
    l.style.color = ink; l.onclick = () => select(i);
    tl.append(l);
    const w = l.offsetWidth;
    let left = Math.min(Math.max(0, px - w / 2), W - w);
    let row = rowsEnd.findIndex((end) => end + 6 < left);
    if (row < 0) { row = rowsEnd.length; rowsEnd.push(-Infinity); }
    rowsEnd[row] = left + w;
    const top = 64 + row * 26;
    l.style.left = left + 'px'; l.style.top = top + 'px';
    const ld = document.createElement('div'); ld.className = 'lead'; ld.style.borderColor = ink;
    ld.style.left = px + 'px'; ld.style.top = '44px'; ld.style.height = (top - 44) + 'px';
    tl.insertBefore(ld, d);
  });
  tl.style.height = (64 + rowsEnd.length * 26 + 8) + 'px';
}

function drawCard() {
  const e = ENTRIES[selected], era = ERAS[e.era], ink = `rgb(${era.ink})`, card = $('card');
  card.style.borderLeftColor = ink;
  card.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = e.name; h.style.color = ink;
  const m = document.createElement('div'); m.className = 'meta';
  m.textContent = `${e.yearText || (e.year < 1000 ? e.year + ' CE' : e.year)}  ·  ${era.name}  ·  ${e.who}`;
  const tag = document.createElement('span'); tag.className = 'tag'; tag.style.background = ink; tag.textContent = BEHAVES[e.behaves];
  const p = document.createElement('p'); p.textContent = e.note;
  card.append(h, m, tag, p);
}

function newGen() {
  const e = ENTRIES[selected];
  calibrate(e);
  INK = ERAS[e.era].ink;
  play.gen = new Gen(e); play.brk = true;
}
// A new entry starts on clean paper, so one figure's ghost does not muddle
// the next; New start keeps the ghost, like the other pages.
function clearScreens() {
  hist.length = 0; drawnTo = 0;
  for (const v of VIEWS) { v.tx.fillStyle = '#000'; v.tx.fillRect(0, 0, v.W * SS, v.W * SS); v.prev = null; }
}
function select(i) {
  selected = (i + ENTRIES.length) % ENTRIES.length;
  clearScreens(); newGen(); drawTimeline(); drawCard();
}

$('eras').innerHTML = Object.values(ERAS).map((e) => `<span style="--c:rgb(${e.ink});color:rgb(${e.ink})">${e.name}</span>`).join('');
$('btnPlay').onclick = () => {
  play.paused = !play.paused;
  if (!play.paused) rebase();
  $('btnPlay').textContent = play.paused ? 'Play' : 'Pause';
};
$('btnRestart').onclick = newGen;
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') select(selected + 1);
  if (e.key === 'ArrowLeft') select(selected - 1);
});
window.addEventListener('resize', drawTimeline);

select(ENTRIES.findIndex((e) => e.id === 'lorenz'));
rebase();
requestAnimationFrame(frame);
</script>
</body>
</html>
