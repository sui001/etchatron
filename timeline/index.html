<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attractor Timeline</title>
<!-- PAGE_VERSION below: bump on every change, shown in the header -->
<!--
  Attractor timeline. Strange attractors and their ancestors, from
  Ptolemy's epicycles to Halvorsen, each drawn live on four screens (top,
  front, side in a drafting layout, plus an orthogonal view you drag to turn).

  Only Lorenz (1963) onward were found as attractors. The older entries are
  older equations shown the way later work found them to behave: the
  pendulum, Duffing, van der Pol and the governor go chaotic once they have
  friction and a rhythmic push. Each entry says which it is.

  Every entry is calibrated the first time it is picked: a silent run
  measures its size, it is scaled to fit the box without distorting it, and
  its step is set so it moves at Lorenz's average speed. Steps are RK4.

  The entries themselves are in ../lib/timeline.js, which the control page
  loads too, so serve the repo root, not this folder:
    python -m http.server 8000
  then http://localhost:8000/timeline/
-->
<style>
:root {
  --paper: #f7f4ec;
  --card: #ffffff;
  --ink: #111111;
  --line: #1a1a1a;
  --soft: #d8d2c4;
  --accent: #0047c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 12px 16px 4px; }
header h1 { font-size: 20px; margin: 0; }
#pageVer { color: var(--accent); font-weight: 700; font-size: 15px; }
header .sub { font-weight: 600; }
button { font: inherit; font-weight: 700; color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: #fff3c4; }
button.primary { background: var(--ink); color: #fff; }
/* timeline */
#tl { position: relative; margin: 8px 16px 0; height: 210px; }
#tl .axis { position: absolute; left: 0; right: 0; top: 34px; height: 3px; background: var(--line); }
#tl .tick { position: absolute; top: 40px; font-size: 12px; font-weight: 700; transform: translateX(-50%); }
#tl .tick::before { content: ""; position: absolute; left: 50%; top: -9px; height: 8px; border-left: 2px solid var(--line); }
#tl .dot { position: absolute; z-index: 3; top: 27px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%;
  border: 2px solid var(--line); cursor: pointer; }
#tl .lab { position: absolute; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
  padding: 1px 6px; border-radius: 6px; border: 2px solid transparent; background: var(--paper); z-index: 2; }
#tl .lab b { font-weight: 800; }
#tl .lab.sel { border-color: var(--line); background: #fff; }
#tl .lead { position: absolute; border-left: 2px solid; width: 0; }
.eras { display: flex; gap: 14px; flex-wrap: wrap; padding: 2px 16px 0; font-weight: 700; font-size: 13px; }
.eras span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  margin-right: 5px; vertical-align: -1px; background: var(--c); }
/* entry card and controls */
.bar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 10px 16px 0; max-width: 1240px; }
@media (max-width: 800px) { .bar { grid-template-columns: 1fr; } }
#card { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px;
  border-left-width: 10px; }
#card h2 { margin: 0; font-size: 19px; }
#card .meta { font-weight: 700; }
#card .tag { display: inline-block; margin-top: 6px; padding: 1px 9px; border-radius: 999px; font-weight: 800;
  font-size: 13px; color: #fff; }
#card p { margin: 6px 0 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stats { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 8px; }
/* screens: drafting layout (third angle), top over front, side beside front */
main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px;
  max-width: 1240px; grid-template-areas: "top orth" "front side"; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-areas: "top" "front" "side" "orth"; } }
section { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; }
h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 13px; }
canvas { width: 100%; aspect-ratio: 1; background: var(--paper); border-radius: 8px; display: block;
  border: 1px solid var(--soft); }
#vo { cursor: grab; touch-action: none; }
#vo.drag { cursor: grabbing; }
</style>
</head>
<body>
<header>
  <h1>Attractor timeline <span id="pageVer"></span></h1>
  <span class="sub">from Ptolemy to Halvorsen, click an entry or use the arrow keys</span>
</header>
<div class="eras" id="eras"></div>
<div id="tl"></div>

<div class="bar">
  <div id="card"></div>
  <div>
    <div class="controls">
      <button id="btnPlay" class="primary">Pause</button>
      <button id="btnRestart">New start</button>
    </div>
    <div class="stats">Steps <span id="sSteps">0</span></div>
  </div>
</div>

<main>
  <section style="grid-area:side"><h3>Side <small>(from the right, looking along x: y-z plane)</small></h3><canvas id="vx" width="560" height="560"></canvas></section>
  <section style="grid-area:front"><h3>Front <small>(looking along y: x-z plane)</small></h3><canvas id="vy" width="560" height="560"></canvas></section>
  <section style="grid-area:top"><h3>Top <small>(looking down z: x-y plane)</small></h3><canvas id="vz" width="560" height="560"></canvas></section>
  <section style="grid-area:orth"><h3>Orthogonal <small>(drag to turn)</small></h3><canvas id="vo" width="560" height="560"></canvas></section>
</main>

<script src="../lib/timeline.js"></script>
<script>
'use strict';
const PAGE_VERSION = '0.1.1';   // 0.1.0 first page: 16 entries, four screens, light theme; 0.1.1 entries moved to ../lib/timeline.js, shared with the control page
document.getElementById('pageVer').textContent = 'v' + PAGE_VERSION;
const $ = (id) => document.getElementById(id);

// The entries, Gen and calibrate live in ../lib/timeline.js, shared with
// the control page.
const { ERAS, BEHAVES, ENTRIES, TARGET, TC, MAX_DRAWN, Gen, calibrate } = TIMELINE;

// --------------------------------------------------------------- the trail
// The control page's afterglow, turned to ink on paper. Each view's trail
// canvas holds ink as light on black, faded every 60 Hz frame (multiplied by
// 252/255 with 2.5% black over it), and is shown inverted and multiplied onto
// the paper: fresh lines in the era's ink, paling to paper, with 8-bit
// rounding leaving the faint ghost of the whole figure. The orthogonal view
// rebuilds its trail from history when it turns; DECAY is that fade in 8-bit
// arithmetic, rounding to nearest, as views/index.html works it out.
const FRAME_MS = 1000 / 60;
const HIST_MAX = 30000 * MAX_DRAWN;
function fade(ctx, n) {
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgb(252,252,252)'; ctx.fillRect(0, 0, n, n);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.025)'; ctx.fillRect(0, 0, n, n);
}
const DECAY = (() => {
  const keep = 1 - Math.round(0.025 * 255) / 255;
  let row = new Uint8Array(256);
  for (let i = 0; i < 256; i++) row[i] = i;
  const rows = [row];
  for (let f = 1; f < 2000; f++) {
    const next = row.map((v) => Math.round(Math.round(v * 252 / 255) * keep));
    rows.push(next);
    if (next.every((v, i) => v === row[i])) break;
    row = next;
  }
  return rows;
})();
const faded = (c, frames) => {
  const row = DECAY[Math.min(DECAY.length - 1, Math.max(0, Math.round(frames)))];
  return c.map((v) => row[v]);
};

// history: { p, t, c, brk, st } = point, time drawn, trail colour (ink
// inverted), no line into it, last point of its step
const hist = [];
let drawnTo = 0;
let INK = [0, 0, 0];
function addPoint(p, t, brk, st) { hist.push({ p, t, brk, st, c: INK.map((v) => 255 - v) }); }

// -------------------------------------------------------------- the views
const SS = 2;
const AXIS = ['#d00000', '#008a00', '#0050d0'];       // x, y, z
const AXN = ['x', 'y', 'z'];
const orient = { yaw: -0.6, pitch: 0.45 };
const C = TC;

function flatView(id, h, v) {
  return { id, h, v, proj(p, W) {
    const K = (W / 2 - 20) / 29;
    return [W / 2 + (p[h] - C[h]) * K, W / 2 - (p[v] - C[v]) * K];
  } };
}
function rot(d) {
  const cy = Math.cos(orient.yaw), sy = Math.sin(orient.yaw);
  const cp = Math.cos(orient.pitch), sp = Math.sin(orient.pitch);
  const x = d[0] * cy - d[1] * sy, y = d[0] * sy + d[1] * cy;
  return [x, d[2] * cp + y * sp];
}
const VIEWS = [
  flatView('vx', 1, 2),
  flatView('vy', 0, 2),
  flatView('vz', 0, 1),
  { id: 'vo', ortho: true, proj(p, W) {
    const K = (W / 2 - 20) / 42;
    const [u, v] = rot([p[0] - C[0], p[1] - C[1], p[2] - C[2]]);
    return [W / 2 + u * K, W / 2 - v * K];
  } },
];
for (const v of VIEWS) {
  v.cv = $(v.id); v.cx = v.cv.getContext('2d'); v.W = v.cv.width;
  v.trail = document.createElement('canvas'); v.trail.width = v.trail.height = v.W * SS;
  v.tx = v.trail.getContext('2d'); v.tx.fillStyle = '#000'; v.tx.fillRect(0, 0, v.W * SS, v.W * SS);
  v.prev = null; v.dirty = false;
}
function segment(t, a, b) { t.moveTo(a[0] * SS, a[1] * SS); t.lineTo(b[0] * SS, b[1] * SS); }

function rebuild(v, now) {
  const t = v.tx, n = v.W * SS, groups = new Map(), ghost = DECAY.length - 1;
  t.fillStyle = '#000'; t.fillRect(0, 0, n, n);
  let prev = null, brk = false;
  for (let i = 0; i < hist.length; i++) {
    const h = hist[i], age = (now - h.t) / FRAME_MS;
    brk = brk || h.brk;
    if (!h.st && age >= ghost) continue;               // ghost: step ends are enough
    const s = v.proj(h.p, v.W);
    if (prev && !brk) {
      const c = faded(h.c, age);
      if (c[0] || c[1] || c[2]) {
        const key = `rgb(${c})`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(prev, s);
      }
    }
    prev = s; brk = false;
  }
  t.lineCap = 'round'; t.lineWidth = 2 * SS;
  for (const [key, segs] of groups) {
    t.strokeStyle = key; t.beginPath();
    for (let i = 0; i < segs.length; i += 2) segment(t, segs[i], segs[i + 1]);
    t.stroke();
  }
  v.prev = prev; v.dirty = false;
}

const PAPER = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
function render(v, now) {
  const W = v.W, t = v.tx;
  if (v.dirty) rebuild(v, now);
  else {
    fade(t, W * SS);
    t.lineCap = 'round'; t.lineWidth = 2 * SS;
    for (let i = drawnTo; i < hist.length; i++) {
      const h = hist[i], s = v.proj(h.p, W);
      if (h.brk) v.prev = null;
      if (v.prev) { t.strokeStyle = `rgb(${h.c})`; t.beginPath(); segment(t, v.prev, s); t.stroke(); }
      v.prev = s;
    }
  }
  const x = v.cx;
  x.globalCompositeOperation = 'source-over'; x.fillStyle = PAPER; x.fillRect(0, 0, W, W);
  x.globalCompositeOperation = 'multiply'; x.filter = 'invert(1)';
  x.drawImage(v.trail, 0, 0, W, W);
  x.filter = 'none'; x.globalCompositeOperation = 'source-over';
  const last = hist[hist.length - 1];
  if (last) {
    const [hx, hy] = v.proj(last.p, W);
    x.fillStyle = `rgba(${INK},0.18)`; x.beginPath(); x.arc(hx, hy, 11, 0, 7); x.fill();
    x.fillStyle = `rgb(${INK})`; x.beginPath(); x.arc(hx, hy, 4.5, 0, 7); x.fill();
  }
  drawAxes(v);
}

function drawAxes(v) {
  const x = v.cx, o = [28, v.W - 28], L = 34;
  const dirs = v.ortho ? [0, 1, 2].map((i) => { const d = [0, 0, 0]; d[i] = 1; return rot(d); })
    : [0, 1, 2].map((i) => i === v.h ? [1, 0] : i === v.v ? [0, 1] : null);
  x.lineWidth = 2.5; x.font = '700 15px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  dirs.forEach((d, i) => {
    if (!d) return;
    const e = [o[0] + d[0] * L, o[1] - d[1] * L];
    x.strokeStyle = x.fillStyle = AXIS[i];
    x.beginPath(); x.moveTo(o[0], o[1]); x.lineTo(e[0], e[1]); x.stroke();
    const m = Math.hypot(d[0], d[1]) || 1;
    x.fillText(AXN[i], o[0] + d[0] / m * (L * Math.max(m, 0.35) + 11), o[1] - d[1] / m * (L * Math.max(m, 0.35) + 11));
  });
}

(() => {
  const cv = $('vo'); let last = null;
  cv.addEventListener('pointerdown', (e) => { last = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', (e) => {
    if (!last) return;
    const k = 0.01 * cv.width / cv.clientWidth;
    orient.yaw += (e.clientX - last[0]) * k;
    orient.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, orient.pitch + (e.clientY - last[1]) * k));
    last = [e.clientX, e.clientY];
    VIEWS[3].dirty = true;
  });
  const up = () => { last = null; cv.classList.remove('drag'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
})();

// -------------------------------------------------------------- the clock
const play = { gen: null, paused: false, t0: 0, n: 0, brk: true };
function rebase() { play.t0 = performance.now(); play.n = 0; }
function advance(now) {
  if (play.paused) return;
  const due = Math.floor((now - play.t0) / 10);
  if (due - play.n > 300) play.n = due - 300;
  while (play.n < due) {
    const pts = play.gen.step(), t = play.t0 + play.n * 10;
    play.n++;
    pts.forEach((p, i) => addPoint(p, t + 10 * (i + 1) / pts.length, play.brk && i === 0, i === pts.length - 1));
    play.brk = false;
  }
}
function frame() {
  const now = performance.now();
  advance(now);
  for (const v of VIEWS) render(v, now);
  drawnTo = hist.length;
  if (hist.length > HIST_MAX + 5000) { hist.splice(0, hist.length - HIST_MAX); drawnTo = hist.length; }
  $('sSteps').textContent = play.gen.steps;
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- timeline
// Log scale of years before now, so the twentieth century's crowd has room
// and Ptolemy still fits on the left.
const NOW = 2026, OLDEST = 2100, NEWEST = 12;
const frac = (year) => (Math.log(OLDEST) - Math.log(NOW - year)) / (Math.log(OLDEST) - Math.log(NEWEST));
let selected = 0;

function drawTimeline() {
  const tl = $('tl'), W = tl.clientWidth;
  tl.textContent = '';
  const ax = document.createElement('div'); ax.className = 'axis'; tl.append(ax);
  let lastTick = -Infinity;
  for (const y of [1000, 1500, 1700, 1800, 1900, 1950, 2000]) {
    if (frac(y) * W - lastTick < 44) continue;          // a narrow screen keeps the ticks that fit
    lastTick = frac(y) * W;
    const t = document.createElement('div'); t.className = 'tick';
    t.style.left = (frac(y) * 100) + '%'; t.textContent = y < 1000 ? y + ' CE' : y; tl.append(t);
  }
  // labels in rows below the axis, each in the first row with room
  const rowsEnd = [];
  ENTRIES.forEach((e, i) => {
    const px = frac(e.year) * W, ink = `rgb(${ERAS[e.era].ink})`;
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = px + 'px'; d.style.background = ink;
    d.title = e.name; d.onclick = () => select(i); tl.append(d);
    const l = document.createElement('div'); l.className = 'lab' + (i === selected ? ' sel' : '');
    l.innerHTML = `<b>${e.yearText || (e.year < 1000 ? e.year + ' CE' : e.year)}</b> ${e.name}`;
    l.style.color = ink; l.onclick = () => select(i);
    tl.append(l);
    const w = l.offsetWidth;
    let left = Math.min(Math.max(0, px - w / 2), W - w);
    let row = rowsEnd.findIndex((end) => end + 6 < left);
    if (row < 0) { row = rowsEnd.length; rowsEnd.push(-Infinity); }
    rowsEnd[row] = left + w;
    const top = 64 + row * 26;
    l.style.left = left + 'px'; l.style.top = top + 'px';
    const ld = document.createElement('div'); ld.className = 'lead'; ld.style.borderColor = ink;
    ld.style.left = px + 'px'; ld.style.top = '44px'; ld.style.height = (top - 44) + 'px';
    tl.insertBefore(ld, d);
  });
  tl.style.height = (64 + rowsEnd.length * 26 + 8) + 'px';
}

function drawCard() {
  const e = ENTRIES[selected], era = ERAS[e.era], ink = `rgb(${era.ink})`, card = $('card');
  card.style.borderLeftColor = ink;
  card.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = e.name; h.style.color = ink;
  const m = document.createElement('div'); m.className = 'meta';
  m.textContent = `${e.yearText || (e.year < 1000 ? e.year + ' CE' : e.year)}  ·  ${era.name}  ·  ${e.who}`;
  const tag = document.createElement('span'); tag.className = 'tag'; tag.style.background = ink; tag.textContent = BEHAVES[e.behaves];
  const p = document.createElement('p'); p.textContent = e.note;
  card.append(h, m, tag, p);
}

function newGen() {
  const e = ENTRIES[selected];
  calibrate(e);
  INK = ERAS[e.era].ink;
  play.gen = new Gen(e); play.brk = true;
}
// A new entry starts on clean paper, so one figure's ghost does not muddle
// the next; New start keeps the ghost, like the other pages.
function clearScreens() {
  hist.length = 0; drawnTo = 0;
  for (const v of VIEWS) { v.tx.fillStyle = '#000'; v.tx.fillRect(0, 0, v.W * SS, v.W * SS); v.prev = null; }
}
function select(i) {
  selected = (i + ENTRIES.length) % ENTRIES.length;
  clearScreens(); newGen(); drawTimeline(); drawCard();
}

$('eras').innerHTML = Object.values(ERAS).map((e) => `<span style="--c:rgb(${e.ink});color:rgb(${e.ink})">${e.name}</span>`).join('');
$('btnPlay').onclick = () => {
  play.paused = !play.paused;
  if (!play.paused) rebase();
  $('btnPlay').textContent = play.paused ? 'Play' : 'Pause';
};
$('btnRestart').onclick = newGen;
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') select(selected + 1);
  if (e.key === 'ArrowLeft') select(selected - 1);
});
window.addEventListener('resize', drawTimeline);

select(ENTRIES.findIndex((e) => e.id === 'lorenz'));
rebase();
requestAnimationFrame(frame);
</script>
</body>
</html>
